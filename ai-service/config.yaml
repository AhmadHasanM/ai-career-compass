# Parameter pipeline RAG. Nilai rahasia (API key, DSN) tetap di .env.
llm:
  temperature: 0.2
  max_tokens: 1024
extraction:
  temperature: 0.0
  max_retries: 2
chunking:
  chunk_size: 800        # karakter
  chunk_overlap: 100
embedding:
  batch_size: 32
