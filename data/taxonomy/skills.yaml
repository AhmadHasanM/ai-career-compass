# Skill taxonomy AI Career Compass.
# - slug unik, kebab-case. Nama dan slug otomatis ikut jadi alias (lowercase) saat seeding.
# - aliases: variasi penulisan di lowongan; harus lowercase dan unik di seluruh file.
# - prerequisites: slug skill lain; harus membentuk DAG (seeder menolak siklus).
#   Prasyarat = urutan belajar PRAKTIS untuk AI Engineer terapan, bukan dependensi teori penuh
#   (misal LLM cukup butuh Python; teori Transformer adalah skill terpisah).
# - category: language | framework | llm | ml | mlops | cloud | data

version: 1

roles:
  - name: AI Engineer
    slug: ai-engineer
  - name: ML Engineer
    slug: ml-engineer
  - name: Data Scientist
    slug: data-scientist

skills:
  # ---------- language ----------
  - slug: python
    name: Python
    category: language
    description: Bahasa utama ekosistem AI/ML dan backend data.
    aliases: [python3, py]
  - slug: sql
    name: SQL
    category: language
    description: Query dan pengolahan data relasional.
    aliases: [structured query language, t-sql, pl/sql]
  - slug: javascript
    name: JavaScript
    category: language
    description: Bahasa web untuk frontend dan Node.js.
    aliases: [js, es6, ecmascript]
  - slug: typescript
    name: TypeScript
    category: language
    description: JavaScript dengan static typing.
    aliases: [ts]
    prerequisites: [javascript]
  - slug: go
    name: Go
    category: language
    description: Bahasa backend yang cepat dan sederhana untuk layanan API.
    aliases: [golang]
  - slug: java
    name: Java
    category: language
    description: Bahasa enterprise, dipakai di beberapa pipeline data.
    aliases: [java 8, java 11, java 17]
  - slug: bash
    name: Bash / Shell Scripting
    category: language
    description: Otomasi tugas di lingkungan Linux.
    aliases: [shell, shell scripting, bash scripting]
    prerequisites: [linux]
  - slug: r
    name: R
    category: language
    description: Bahasa statistik dan analisis data.
    aliases: [r language, rstudio]

  # ---------- framework ----------
  - slug: fastapi
    name: FastAPI
    category: framework
    description: Framework API Python berbasis type hint dan async.
    aliases: [fast api]
    prerequisites: [python, rest-api]
  - slug: flask
    name: Flask
    category: framework
    description: Micro-framework web Python.
    prerequisites: [python, rest-api]
  - slug: django
    name: Django
    category: framework
    description: Framework web Python full-stack.
    aliases: [django rest framework, drf]
    prerequisites: [python, rest-api]
  - slug: rest-api
    name: REST API
    category: framework
    description: Desain dan konsumsi API berbasis HTTP.
    aliases: [restful api, restful, rest, api development, web api]
  - slug: nodejs
    name: Node.js
    category: framework
    description: Runtime JavaScript di sisi server.
    aliases: [node, node js, express, expressjs, express.js]
    prerequisites: [javascript]
  - slug: react
    name: React
    category: framework
    description: Library UI berbasis komponen.
    aliases: [reactjs, react.js, react js]
    prerequisites: [javascript]
  - slug: nextjs
    name: Next.js
    category: framework
    description: Framework React untuk aplikasi web full-stack.
    aliases: [next js, next]
    prerequisites: [react]
  - slug: streamlit
    name: Streamlit / Gradio
    category: framework
    description: Membuat demo dan dashboard data atau model ML dengan Python.
    aliases: [gradio]
    prerequisites: [python]
  - slug: pytorch
    name: PyTorch
    category: framework
    description: Framework deep learning dengan komputasi dinamis.
    aliases: [torch]
    prerequisites: [python, deep-learning]
  - slug: tensorflow
    name: TensorFlow
    category: framework
    description: Framework deep learning dari Google.
    aliases: [tf, tensorflow 2]
    prerequisites: [python, deep-learning]
  - slug: keras
    name: Keras
    category: framework
    description: API high-level untuk deep learning.
    prerequisites: [tensorflow]
  - slug: scikit-learn
    name: scikit-learn
    category: framework
    description: Library machine learning klasik di Python.
    aliases: [sklearn, scikit learn]
    prerequisites: [python, machine-learning]
  - slug: huggingface-transformers
    name: Hugging Face Transformers
    category: framework
    description: Library model pretrained untuk NLP, vision, dan audio.
    aliases: [hugging face, huggingface, transformers library, hf transformers, huggingface transformers]
    prerequisites: [pytorch]

  # ---------- llm ----------
  - slug: llm
    name: Large Language Models
    category: llm
    description: Konsep dan pemakaian model bahasa besar.
    aliases: [large language model, llms, generative ai, genai, gen ai]
    prerequisites: [python]
  - slug: prompt-engineering
    name: Prompt Engineering
    category: llm
    description: Merancang prompt agar output LLM akurat dan konsisten.
    aliases: [prompting, prompt design]
    prerequisites: [llm]
  - slug: llm-api
    name: LLM API Integration
    category: llm
    description: Memanggil API LLM (OpenAI, Anthropic, Gemini, dan endpoint kompatibel).
    aliases: [openai api, openai, chatgpt api, gpt api, anthropic api, claude api, gemini api]
    prerequisites: [llm, rest-api]
  - slug: embeddings
    name: Embeddings
    category: llm
    description: Representasi vektor teks untuk pencarian semantik.
    aliases: [text embeddings, embedding model, sentence embeddings, sentence transformers]
    prerequisites: [llm]
  - slug: semantic-search
    name: Semantic Search
    category: llm
    description: Pencarian berbasis kemiripan makna, termasuk hybrid search.
    aliases: [vector search, similarity search, hybrid search]
    prerequisites: [embeddings]
  - slug: rag
    name: Retrieval-Augmented Generation
    category: llm
    description: Menggabungkan retrieval dokumen dengan generasi LLM.
    aliases: [retrieval augmented generation, retrieval-augmented generation (rag)]
    prerequisites: [embeddings, prompt-engineering]
  - slug: langchain
    name: LangChain
    category: llm
    description: Framework orkestrasi aplikasi LLM.
    aliases: [lang chain]
    prerequisites: [python, llm-api]
  - slug: llamaindex
    name: LlamaIndex
    category: llm
    description: Framework data dan indexing untuk aplikasi RAG.
    aliases: [llama index, llama-index, gpt index]
    prerequisites: [python, rag]
  - slug: langgraph
    name: LangGraph
    category: llm
    description: Orkestrasi agent berbasis graf di atas LangChain.
    aliases: [lang graph]
    prerequisites: [langchain, ai-agents]
  - slug: function-calling
    name: Function Calling / Tool Use
    category: llm
    description: LLM memanggil tool atau fungsi eksternal dengan output terstruktur.
    aliases: [tool use, tool calling, structured output, json mode]
    prerequisites: [llm-api]
  - slug: ai-agents
    name: AI Agents
    category: llm
    description: Sistem LLM yang merencanakan dan menjalankan tool secara otonom.
    aliases: [agentic ai, llm agents, autonomous agents, multi-agent, agent]
    prerequisites: [function-calling]
  - slug: llm-fine-tuning
    name: LLM Fine-tuning
    category: llm
    description: Menyesuaikan LLM dengan data domain (SFT, instruction tuning).
    aliases: [fine-tuning, fine tuning, finetuning, sft, instruction tuning, fine-tuning llm, llm fine-tuning, fine tuning llm]
    prerequisites: [llm, pytorch]
  - slug: peft
    name: PEFT / LoRA
    category: llm
    description: Fine-tuning hemat parameter seperti LoRA dan QLoRA.
    aliases: [lora, qlora, parameter-efficient fine-tuning]
    prerequisites: [llm-fine-tuning, huggingface-transformers]
  - slug: llm-evaluation
    name: LLM Evaluation
    category: llm
    description: Mengukur kualitas output LLM dan RAG (faithfulness, relevance).
    aliases: [llm eval, rag evaluation, ragas, llm-as-a-judge, deepeval]
    prerequisites: [llm]
  - slug: llm-observability
    name: LLM Observability
    category: llm
    description: Tracing prompt, token, latensi, dan biaya aplikasi LLM.
    aliases: [langfuse, langsmith, llm monitoring, llmops]
    prerequisites: [llm-api]
  - slug: guardrails
    name: LLM Guardrails & Safety
    category: llm
    description: Validasi input/output dan mitigasi prompt injection serta halusinasi.
    aliases: [ai safety, llm safety, prompt injection, responsible ai, nemo guardrails]
    prerequisites: [prompt-engineering]
  - slug: llm-serving
    name: LLM Serving & Inference
    category: llm
    description: Menjalankan model open-source secara efisien (vLLM, Ollama, TGI).
    aliases: [vllm, ollama, tgi, text generation inference, llama.cpp, model quantization, quantization]
    prerequisites: [llm, docker]

  # ---------- ml ----------
  - slug: machine-learning
    name: Machine Learning
    category: ml
    description: Algoritma supervised dan unsupervised learning.
    aliases: [ml, machine learning algorithms, pembelajaran mesin]
    prerequisites: [python, statistics, linear-algebra]
  - slug: deep-learning
    name: Deep Learning
    category: ml
    description: Neural network multi-layer (CNN, RNN, dan lainnya).
    aliases: [dl, neural networks, neural network, ann, cnn, rnn, lstm]
    prerequisites: [machine-learning]
  - slug: nlp
    name: Natural Language Processing
    category: ml
    description: Pemrosesan bahasa alami seperti klasifikasi teks dan NER.
    aliases: [natural language processing, text mining, text classification, ner]
    prerequisites: [machine-learning]
  - slug: computer-vision
    name: Computer Vision
    category: ml
    description: Pengolahan gambar dan video (deteksi, segmentasi).
    aliases: [cv, image processing, opencv, object detection, yolo]
    prerequisites: [deep-learning]
  - slug: transformer-architecture
    name: Transformer Architecture
    category: ml
    description: Arsitektur attention yang mendasari LLM modern.
    aliases: [transformer, transformers, attention mechanism, bert, self-attention]
    prerequisites: [deep-learning, nlp]
  - slug: statistics
    name: Statistics & Probability
    category: ml
    description: Statistik deskriptif, inferensial, dan probabilitas.
    aliases: [statistics, statistik, probability, probabilitas, hypothesis testing, a/b testing]
  - slug: linear-algebra
    name: Linear Algebra & Calculus
    category: ml
    description: Matematika dasar untuk ML (vektor, matriks, gradien).
    aliases: [linear algebra, aljabar linear, calculus, kalkulus, mathematics for ml]
  - slug: feature-engineering
    name: Feature Engineering
    category: ml
    description: Membentuk fitur dari data mentah untuk model.
    aliases: [feature selection, data preprocessing, preprocessing]
    prerequisites: [pandas, machine-learning]
  - slug: model-evaluation
    name: Model Evaluation
    category: ml
    description: Metrik, validasi silang, dan analisis error model.
    aliases: [model validation, cross-validation, evaluation metrics, hyperparameter tuning]
    prerequisites: [machine-learning]
  - slug: recommender-systems
    name: Recommender Systems
    category: ml
    description: Sistem rekomendasi collaborative dan content-based.
    aliases: [recommendation system, recommendation engine, sistem rekomendasi]
    prerequisites: [machine-learning]
  - slug: time-series
    name: Time Series Forecasting
    category: ml
    description: Analisis dan peramalan data deret waktu.
    aliases: [forecasting, time series analysis, arima, prophet]
    prerequisites: [statistics, machine-learning]

