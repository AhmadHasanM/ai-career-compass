# Sumber belajar terkurasi (S4-T6). Dikirim ke backend lewat:
#   docker compose exec ai-service python scripts/ingest_cli.py resources
#
# - skill: slug di data/taxonomy/skills.yaml
# - type: course | docs | video | article | book | tutorial
# - level: beginner | intermediate | advanced
# - est_hours: PERKIRAAN kasar waktu belajar inti, bukan angka resmi penyedia
# - Draf awal didominasi sumber resmi berbahasa Inggris; tambahkan sumber berbahasa Indonesia (language: id).
# - Semua URL dicek HTTP 200 pada 2026-09-26, kecuali otexts.com (202) dan dev.mysql.com (403) yang memblokir bot.

