name: ai-career-compass

x-app-env: &app-env
  env_file: .env
  networks: [internal]

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [internal]

  # Menjalankan migrasi golang-migrate lalu selesai.
  migrate:
    image: migrate/migrate:v4.18.1
    command: ["-path=/migrations", "-database=${DATABASE_URL}", "up"]
    volumes:
      - ./backend/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  # Seed taxonomy dari data/taxonomy/skills.yaml (idempotent) lalu selesai.
  seed:
    <<: *app-env
    build: ./backend
    command: ["/app/seed", "-file", "/data/taxonomy/skills.yaml"]
    volumes:
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  backend:
    <<: *app-env
    build: ./backend
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      BACKEND_PORT: "8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # Tidak diekspos ke host: hanya bisa diakses backend lewat jaringan internal.
  ai-service:
    <<: *app-env
    build: ./ai-service
    volumes:
      - ./data:/data:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  frontend:
    networks: [internal]
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:

networks:
  internal:
